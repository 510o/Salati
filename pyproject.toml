[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "salati"
version = "0.1.0"
description = "صلاتي: مواقيت الصلاة وعدّاد وإشعارات بإعدادات مرنة"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "customtkinter>=5.2",
    "arabicdisplayer @ git+https://github.com/510o/ArabicDisplayer.git",
    "plyer>=2.1; sys_platform == 'win32'",
]

[project.scripts]
salati = "src.app:run"

[tool.setuptools]
packages = ["src", "src.ui"]
